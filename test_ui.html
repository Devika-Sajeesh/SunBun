<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunBun Assistant Test UI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #3b82f6; color: white; }
        .assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
        #input-container { padding: 20px; background: #1e293b; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #f59e0b; color: #0f172a; font-weight: bold; cursor: pointer; }
        button:hover { background: #fbbf24; }
        .status { font-size: 12px; color: #94a3b8; padding: 0 20px 10px; }
    </style>
</head>
<body>
    <div style="padding: 20px; background: #f59e0b; color: #0f172a; font-weight: bold; text-align: center;">🌞 SunBun Solar Assistant - Local Test UI</div>
    <div id="chat-container">
        <div class="message assistant">Hello! I'm your SunBun Solar Assistant. How can I help you today?</div>
    </div>
    <div class="status" id="status">Connecting to http://localhost:8000...</div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const sessionId = "session-" + Math.random().toString(36).substring(7);
        const chatContainer = document.getElementById('chat-container');
        const statusEl = document.getElementById('status');
        const baseUrl = "http://localhost:8000";

        // Check health on load
        fetch(`${baseUrl}/health`)
            .then(r => r.json())
            .then(data => statusEl.innerText = "✅ Connected to SunBun API")
            .catch(err => statusEl.innerHTML = "❌ Failed to connect to http://localhost:8000. Ensure server is running with: <code>python -m api.main</code>");

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            // Add user message to UI
            addMessage(message, 'user');
            input.value = '';

            try {
                statusEl.innerText = "⏳ Assistant is thinking...";
                const response = await fetch(`${baseUrl}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: message })
                });

                const data = await response.json();
                addMessage(data.response, 'assistant');
                statusEl.innerText = `✅ Current Node: ${data.current_node}`;
            } catch (error) {
                console.error(error);
                addMessage("Error: Could not reach the server. Make sure it's running!", 'assistant');
                statusEl.innerText = "❌ Connection failed";
            }
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
